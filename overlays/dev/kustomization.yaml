apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- cnpg-superuser-secret.yaml
- nextcloud-owner-secret.yaml
- nextcloud-cluster.yaml

patches:
  # - target:
      # kind: Deployment
      # name: redis
    # patch: |-
      # - op: replace
        # path: /spec/replicas
        # value: 0
  - target:
      kind: Backup
      name: nextcloud-backup
    patch: |-
      - op: replace
        path: /spec/schedule/suspend
        value: true
  - target:
      kind: MariaDB
      name: nextcloud-mariadb
    patch: |-
      - op: replace
        path: /spec/suspend
        value: true
