apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-tls
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud.dev.vogelfamily.ch`)
      kind: Rule
      middlewares:
        - name: nextcloud-header
        - name: nextcloud-regex
      services:
        - name: nextcloud
          port: 80
          sticky:
            cookie:
              httpOnly: false
              name: nc-session
              secure: true
              sameSite: none   
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nextcloud.dev.vogelfamily.ch`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
        - name: nextcloud-header
        - name: nextcloud-regex
      services:
        - name: nextcloud
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-header
spec:
  headers:
    forceSTSHeader: true
    stsPreload: true
    contentTypeNosniff: true
    browserXssFilter: true
    stsIncludeSubdomains: true
    stsSeconds: 63072000
    frameDeny: true
    sslRedirect: true
    accessControlAllowMethods:
      - "GET"
    accessControlAllowOriginList:
      - "https://nextcloud.dev.vogelfamily.ch"
    accessControlMaxAge: 100
    addVaryHeader: true
    customFrameOptionsValue: SAMEORIGIN
    hostsProxyHeaders:
    - "X-Forwarded-Host"
    referrerPolicy: "same-origin"    
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-regex
spec:
  redirectRegex:
    permanent: true
    regex: "https://(.*)/.well-known/(?:card|cal)dav"
    replacement: "https://${1}/remote.php/dav"    
