apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: default
  destination:
    namespace: nextcloud
    server: https://kubernetes.default.svc
  sources:
  - repoURL: git@github.com:daniva6/k8s.git
    targetRevision: HEAD
    path: nextcloud/overlays/dev
  - repoURL: https://nextcloud.github.io/helm/
    chart: nextcloud
    targetRevision: '6.6.9'
    helm:
      valueFiles:
      - $values/helm-values/nextcloud-values-dev.yaml
  - repoURL: https://github.com/daniva6/nextcloud.git
    targetRevision: HEAD
    ref: values
    