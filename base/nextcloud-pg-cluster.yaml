apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-pg
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:16

  storage:
    size: 10Gi
    storageClass: cephrbd-r2-squid
    
  walStorage:
    storageClass: cephrbd-hdd-r2-squid
    size: 10Gi      

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-cnpg-owner

  superuserSecret:
    name: nextcloud-cnpg-superuser
  enableSuperuserAccess: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      work_mem: "8MB"
      wal_compression: "on"
      checkpoint_completion_target: "0.9"
      max_wal_size: "1GB"
      min_wal_size: "80MB"
      random_page_cost: "1.1"

  affinity:
    enablePodAntiAffinity: true

  monitoring:
    enablePodMonitor: true

